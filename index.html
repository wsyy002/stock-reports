<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦞 每周荐股报告</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="header">
  <h1>🦞 每周荐股报告</h1>
  <div class="subtitle">每周日 19:00 更新 · AI 自动生成</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索报告（按日期或股票名称）..." oninput="filterReports()">
  </div>
</div>
<ul class="report-list" id="reportList">
<li><a href="/reports/2026-06-07.html"><span class="date">2026-06-07</span><span class="tag">最新</span></a></li>
</ul>
<div id="noResult" class="no-result" style="display:none;">没有找到匹配的报告</div>
<div class="footer">
  <p>由 🦞 麻辣小龙虾 自动生成 | 数据来源: 公开市场信息</p>
  <p>投资有风险，入市需谨慎。本报告仅供参考，不构成投资建议。</p>
</div>

<script>
function filterReports() {
  var input = document.getElementById('searchInput');
  var filter = input.value.toLowerCase().trim();
  var ul = document.getElementById('reportList');
  var items = ul.getElementsByTagName('li');
  var noResult = document.getElementById('noResult');
  var visible = 0;

  for (var i = 0; i < items.length; i++) {
    var a = items[i].getElementsByTagName('a')[0];
    if (a) {
      var text = a.textContent || a.innerText;
      if (text.toLowerCase().indexOf(filter) > -1) {
        items[i].style.display = '';
        visible++;
      } else {
        items[i].style.display = 'none';
      }
    }
  }

  noResult.style.display = (visible === 0) ? 'block' : 'none';
}
</script>
</body>
</html>
