<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦞 每周荐股报告</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="header">
  <h1>🦞 每周荐股报告</h1>
  <div class="subtitle">每周日 19:00 更新 · AI 自动生成 · 短线波段</div>
  <div style="margin-top:12px;text-align:center">
    <a href="/strategies/" style="display:inline-block;background:#e94560;color:#fff;padding:10px 24px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:600;">⚔️ 各战法持仓</a>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索股票名称、日期、题材..." oninput="filterReports()">
  </div>
</div>
<ul class="report-list" id="reportList">
<li><a href="/reports/2026-06-14.html"><span class="date">2026-06-14</span><span class="tag">最新</span></a></li>
<li><a href="/reports/2026-06-07.html"><span class="date">2026-06-07</span><span class="date">2026-06-07</span><span class="tag">最新</span></a></li>
</ul>
<div id="noResult" class="no-result" style="display:none;">没有找到匹配的报告</div>
<div class="footer">
  <p>由 🦞 麻辣小龙虾 自动生成 | 数据来源: 公开市场信息</p>
  <p>投资有风险，入市需谨慎。本报告仅供参考，不构成投资建议。</p>
</div>

<script>
var searchIndex = [];
function loadSearchIndex() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/search_index.json', true);
  xhr.onload = function() {
    if (xhr.status === 200) { try { searchIndex = JSON.parse(xhr.responseText); } catch(e) {} }
  };
  xhr.send();
}
loadSearchIndex();

function filterReports() {
  var input = document.getElementById('searchInput');
  var filter = input.value.toLowerCase().trim();
  var ul = document.getElementById('reportList');
  var items = ul.getElementsByTagName('li');
  var noResult = document.getElementById('noResult');
  var visible = 0;
  var searchByStock = filter.length > 0;

  for (var i = 0; i < items.length; i++) {
    var a = items[i].getElementsByTagName('a')[0];
    if (!a) continue;
    var dateText = a.getElementsByClassName('date')[0];
    var dateStr = dateText ? dateText.textContent.trim() : '';
    var match = false;

    if (!searchByStock) {
      match = true;
    } else {
      if (dateStr.toLowerCase().indexOf(filter) > -1) { match = true; }
      if (!match && searchIndex.length > 0) {
        for (var j = 0; j < searchIndex.length; j++) {
          if (searchIndex[j].date === dateStr) {
            var entry = searchIndex[j];
            for (var k = 0; k < entry.stocks.length; k++) {
              if (entry.stocks[k].toLowerCase().indexOf(filter) > -1) { match = true; break; }
            }
            if (!match) {
              for (var k = 0; k < entry.keywords.length; k++) {
                if (entry.keywords[k].toLowerCase().indexOf(filter) > -1) { match = true; break; }
              }
            }
            break;
          }
        }
      }
    }
    items[i].style.display = match ? '' : 'none';
    if (match) visible++;
  }
  noResult.style.display = (visible === 0 && searchByStock) ? 'block' : 'none';
}
</script>
</body>
</html>
